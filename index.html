<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendWise</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal Budget</p>
          <h1>SpendWise</h1>
        </div>
        <div class="budget-control">
          <label for="budgetInput">Monthly Budget</label>
          <div class="budget-input-row">
            <input id="budgetInput" type="number" min="0" step="0.01" value="2500" />
            <button id="updateBudgetBtn" type="button">Update</button>
          </div>
        </div>
      </header>

      <main class="dashboard">
        <section class="panel summary-panel">
          <h2>Budget Overview</h2>
          <div class="stats-grid">
            <article class="stat-card">
              <span class="stat-label">Budget</span>
              <strong id="budgetValue">$0.00</strong>
            </article>
            <article class="stat-card">
              <span class="stat-label">Spent</span>
              <strong id="spentValue">$0.00</strong>
            </article>
            <article class="stat-card">
              <span class="stat-label">Remaining</span>
              <strong id="remainingValue">$0.00</strong>
            </article>
          </div>
          <div id="statusMessage" class="status-banner neutral">Your budget is balanced.</div>
        </section>

        <section class="panel form-panel">
          <h2>Add Expense</h2>
          <form id="expenseForm">
            <div class="field-group">
              <label for="expenseName">Expense</label>
              <input id="expenseName" type="text" placeholder="e.g. Groceries" required />
            </div>

            <div class="field-group">
              <label for="expenseCategory">Category</label>
              <select id="expenseCategory">
                <option value="Food">Food</option>
                <option value="Housing">Housing</option>
                <option value="Transport">Transport</option>
                <option value="Utilities">Utilities</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="field-group">
              <label for="expenseAmount">Amount</label>
              <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="0.00" required />
            </div>

            <div class="button-row">
              <button type="submit" class="primary-btn">Add Expense</button>
              <button id="resetBtn" type="button" class="secondary-btn">Reset</button>
            </div>
          </form>
        </section>

        <section class="panel list-panel">
          <h2>Expense Log</h2>
          <div id="expenseList" class="expense-list"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
